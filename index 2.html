<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xcaret100</title>
    
    <!-- PWA Meta Tags for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Xcaret100">
    <link rel="apple-touch-icon" href="https://iili.io/CeJl8np.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .header .back-arrow {
            font-size: 22px;
            cursor: pointer;
            margin-right: 16px;
            text-decoration: none;
            color: #ffffff;
        }

        .header .title {
            font-size: 18px;
            font-weight: 500;
        }

        .content {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            padding: 40px 20px;
            min-height: calc(100vh - 80px);
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .container {
            max-width: 480px;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
        }

        /* Loading Message (Shown when launched from Home Screen) */
        .loading-container {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            padding: 20px;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            letter-spacing: 0.5px;
        }

        /* Add to Home Screen Modal (Shown in regular browser) */
        .a2hs-modal {
            display: none; /* Hidden by default */
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .a2hs-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .a2hs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .a2hs-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
        }

        .a2hs-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #666666;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .a2hs-body {
            font-size: 15px;
            color: #333333;
            line-height: 1.6;
        }

        .a2hs-body ol {
            margin-top: 12px;
            padding-left: 20px;
        }

        .a2hs-body li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .share-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #007AFF;
            border-radius: 6px;
            color: white;
            flex-shrink: 0;
        }

        .share-icon svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="#" class="back-arrow" onclick="window.history.back(); return false;">&#8592;</a>
            <span class="title">Xcaret100</span>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="logo-container">
                <img src="https://iili.io/CeJl8np.png" alt="Xcaret100 Logo">
            </div>

            <!-- Loading Message (Appears below webpage when launched from Home Screen) -->
            <div class="loading-container" id="loadingContainer">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading please wait...</div>
            </div>
        </div>
    </div>

    <!-- Add to Home Screen Illustration Modal -->
    <div class="a2hs-modal" id="a2hsModal">
        <div class="a2hs-card">
            <div class="a2hs-header">
                <h3>Add to Home Screen</h3>
                <button class="a2hs-close" onclick="dismissA2HS()">&times;</button>
            </div>
            <div class="a2hs-body">
                <p>For the best experience, install this app on your device:</p>
                <ol>
                    <li>
                        Tap the Share icon 
                        <span class="share-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                                <polyline points="16 6 12 2 8 6"></polyline>
                                <line x1="12" y1="2" x2="12" y2="15"></line>
                            </svg>
                        </span>
                    </li>
                    <li>Scroll down and tap <strong>"Add to Home Screen"</strong></li>
                </ol>
            </div>
        </div is>
    </div>

    <script>
        // Check if the app is running in standalone mode (launched from Home Screen)
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

        document.addEventListener('DOMContentLoaded', () => {
            if (isStandalone) {
                // User launched from Home Screen: Show loading message below content
                document.getElementById('loadingContainer').style.display = 'flex';
                document.getElementById('a2hsModal').style.display = 'none';

                // Wait 10 seconds (10000 milliseconds), then redirect to home.html
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 10000);
            } else {
                // User is in a regular browser: Show "Add to Home Screen" illustration
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('a2hsModal').style.display = 'flex';
            }
        });

        // Function to dismiss the Add to Home Screen modal
        function dismissA2HS() {
            document.getElementById('a2hsModal').style.display = 'none';
        }

        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
