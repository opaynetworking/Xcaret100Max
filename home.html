<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcaret100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            min-height: 100vh;
            background: #000000;
            position: relative;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 480px;
            z-index: 100;
        }

        .header .back-arrow {
            font-size: 22px;
            cursor: pointer;
            margin-right: 16px;
            text-decoration: none;
            color: #ffffff;
        }

        .header .title {
            font-size: 18px;
            font-weight: 400;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 65px 20px 20px 20px;
        }

        .top-bar .site-name {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .menu-btn {
            border: 1.5px solid #a08050;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            background: transparent;
            text-decoration: none;
            min-width: 60px;
        }

        .menu-btn .dots {
            font-size: 22px;
            color: #ffffff;
            letter-spacing: 3px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .menu-btn .menu-label {
            font-size: 12px;
            color: #cccccc;
            text-decoration: underline;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px 20px;
        }

        .cash-wire {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        .cash-wire .emoji {
            font-size: 48px;
        }

        .alert-section {
            width: 100%;
            padding: 0 10px;
        }

        .alert-text {
            font-size: 24px;
            color: #d4d4d4;
            line-height: 1.55;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .alert-text .alert-label {
            font-weight: 900;
            color: #ffffff;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .cl-badge {
            display: inline-block;
            background-color: #cc2222;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            vertical-align: middle;
            font-family: Arial, sans-serif;
        }

        .start-now {
            color: #00cc00;
            font-weight: 700;
            text-decoration: none;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 24px;
        }

        .start-now:hover {
            text-decoration: underline;
        }

        .scrollbar {
            position: fixed;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 70px;
            background: #666666;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="back-arrow" onclick="window.history.back(); return false;">&#8592;</a>
            <span class="title">Xcaret100</span>
        </div>

        <div class="top-bar">
            <span class="site-name">XCARET100</span>
            <a href="menu.html" class="menu-btn" onclick="window.location.href='menu.html'; return false;">
                <span class="dots">•••</span>
                <span class="menu-label">Menu</span>
            </a>
        </div>

        <div class="content">
            <div class="cash-wire">
                CASH WIRE <span class="emoji">💵</span>
            </div>

            <div class="alert-section">
                <div class="alert-text">
                    💥<span class="alert-label">ALERT:</span> Do not Show This App even to Your Closest Friends, It might be disastrous <span class="cl-badge">CL</span><a href="menu.html" class="start-now" onclick="window.location.href='menu.html'; return false;">Start Nows</a>
                </div>
            </div>
        </div>

        <div class="scrollbar"></div>
    </div>
    <script src="/sw.js"></script>
</body>
</html>
