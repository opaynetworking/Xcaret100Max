<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcaret100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            min-height: 100vh;
            background: #000000;
            position: relative;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 16px 16px;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 480px;
            z-index: 100;
        }

        .header .back-arrow {
            font-size: 24px;
            cursor: pointer;
            margin-right: 20px;
            text-decoration: none;
            color: #ffffff;
        }

        .header .title {
            font-size: 20px;
            font-weight: 400;
        }

        .menu-overlay {
            margin-top: 58px;
            padding: 0 12px;
        }

        .close-menu-box {
            border: 1.5px solid #b8860b;
            padding: 14px 18px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 0;
            min-height: 100px;
        }

        .close-menu-link {
            color: #ffffff;
            font-size: 20px;
            text-decoration: underline;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .close-menu-link .x-icon {
            font-size: 26px;
            font-weight: 300;
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            padding: 24px 10px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 24px;
            font-weight: 700;
            color: #d4456a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
            text-decoration: none;
        }

        .menu-item.cash-wire {
            text-decoration: underline;
            border-bottom: 1px solid #3a3a3a;
            margin-top: -2px;
        }

        .menu-item .emoji {
            font-size: 24px;
        }

        .menu-item.empty {
            height: 70px;
            padding: 0 10px;
        }

        .menu-item.empty-bottom {
            height: 60px;
            padding: 0 10px;
            border-bottom: 1px solid #3a3a3a;
        }

        .separator {
            height: 1px;
            background-color: #3a3a3a;
            margin: 0 10px;
        }

        a.menu-item {
            color: #d4456a;
        }

        a.menu-item:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="back-arrow">&#8592;</a>
            <span class="title">Xcaret100</span>
        </div>

        <div class="menu-overlay">
            <div class="close-menu-box">
                <a href="#" class="close-menu-link">
                    Close Menu <span class="x-icon">&#10005;</span>
                </a>
            </div>

            <ul class="menu-list">
                <li>
                    <a href="select.html" class="menu-item cash-wire">
                        CASH WIRE <span class="emoji"></span>
                    </a>
                </li>
                <li>
                    <a href="act.html" class="menu-item">
                        SHOP EASY <span class="emoji">🛒</span>
                    </a>
                </li>
                <li>
                    <a href="history.html" class="menu-item">
                        TRANSACTIONS <span class="emoji">🇬</span>
                    </a>
                </li>
                <li>
                    <a href="act.html" class="menu-item">
                        ACTIVATE XCARET100
                    </a>
                </li>
                <li>
                    <a href="location.html" class="menu-item">
                        CHANGE LOCATION <span class="emoji">🧙</span>
                    </a>
                </li>
                <li class="menu-item empty"></li>
                <li class="menu-item empty-bottom"></li>
            </ul>
        </div>
    </div>
</body>
</html>
