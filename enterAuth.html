<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authorization Token</title>
    <style>
        /* Reset & Page Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #9d9d9d;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #9d9d9d;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background-color: #000000;
            color: #ffffff;
            padding: 16px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 60px;
            width: 100%;
        }

        /* UPDATED: Added onclick to go back */
        .back-arrow {
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
        }

        .app-title {
            font-size: 18px;
            font-weight: 400;
        }

        /* Main Content */
        .content {
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title-red {
            color: #f7414a;
            font-size: 24px;
            font-style: italic;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .illustration-box {
            background-color: #000000;
            width: 100%;
            aspect-ratio: 500 / 220;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .illustration-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #000000;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        .input-group label {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            white-space: nowrap;
        }

        .input-group input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #5fcbf2;
            padding: 6px 10px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            flex: 1;
            min-width: 0;
        }

        .input-group input::placeholder {
            color: #e0e0e0;
            font-weight: 400;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .button-group button {
            border: none;
            font-size: 18px;
            font-weight: 700;
            padding: 14px 0;
            flex: 1;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s ease;
            border-radius: 0;
            height: 55px;
        }

        .button-group button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #0e58b6;
            color: #ffffff;
        }

        .btn-create {
            background-color: #4cb64c;
            color: #000000;
        }

        /* ================= MODALS & OVERLAYS ================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        /* Floating Loader */
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: #ffffff;
            font-weight: 600;
            font-size: 18px;
        }

        /* Success Modal */
        .success-icon {
            color: #4cb64c;
            font-size: 50px;
            background: #e8f5e9;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-weight: bold;
        }
        .success-text {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .success-subtext {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-success-ok {
            background: #4cb64c;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }

        /* Error Modal */
        .error-icon {
            color: #f7414a;
            font-size: 50px;
            background: #ffebee;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-weight: bold;
        }
        .error-text {
            color: #1a1a1a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .error-subtext {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-error-ok {
            background: #f7414a;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <!-- UPDATED: Back button now navigates to previous page -->
            <span class="back-arrow" onclick="window.history.back()">&#8592;</span>
            <span class="app-title">Xcaret100</span>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Red Title -->
            <h2 class="title-red">
                Enter Authorization<br>
                code to Complete Your<br>
                transaction
            </h2>

            <!-- Illustration Box -->
            <div class="illustration-box">
                <svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
                    <rect width="500" height="220" fill="#000000" />
                    <rect x="100" y="20" width="280" height="170" fill="#f1f1f1" rx="8" />
                    <rect x="120" y="35" width="120" height="20" fill="#dcdcdc" rx="4" />
                    <rect x="120" y="70" width="200" height="12" fill="#dcdcdc" rx="4" />
                    <rect x="120" y="92" width="170" height="12" fill="#dcdcdc" rx="4" />
                    <rect x="120" y="114" width="190" height="12" fill="#dcdcdc" rx="4" />
                    <rect x="120" y="136" width="150" height="12" fill="#dcdcdc" rx="4" />
                    <rect x="120" y="158" width="100" height="12" fill="#dcdcdc" rx="4" />
                    <text x="310" y="75" fill="#46b946" font-size="45" font-weight="bold" font-family="Arial, sans-serif">₹</text>
                    <path d="M 40 160 L 55 100 L 100 100 L 115 160 Z" fill="#1a73e8" />
                    <path d="M 65 100 L 78 130 L 90 100 Z" fill="#fbc02d" />
                    <rect x="70" y="90" width="15" height="15" fill="#fce4b8" />
                    <circle cx="77" cy="65" r="25" fill="#fce4b8" />
                    <path d="M 53 60 A 25 25 0 0 1 101 60 A 18 18 0 0 0 53 60 Z" fill="#424242" />
                    <circle cx="360" cy="90" r="35" fill="#46b946" />
                    <path d="M 345 88 L 355 100 L 375 75" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>

            <!-- Subtitle -->
            <h3 class="subtitle">Authorization Token Required</h3>

            <!-- Input Field -->
            <div class="input-group">
                <label>Auth Token</label>
                <input type="text" id="authCodeInput" placeholder="Enter Authorization code">
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn-login" id="loginBtn">LOGIN</button>
                <!-- UPDATED: Create New button now navigates to buyauthtoken.html -->
                <button class="btn-create" onclick="window.location.href='buyauthtoken.html'">CREATE NEW</button>
            </div>
        </div>
    </div>

    <!-- ================= MODALS ================= -->

    <!-- 1. Floating Loader -->
    <div class="modal-overlay" id="loaderModal">
        <div class="loader-spinner"></div>
        <div class="loader-text">Verifying...</div>
    </div>

    <!-- 2. Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="success-icon">&#10003;</div>
            <div class="success-text">Successful!</div>
            <div class="success-subtext">Authorization code accepted.<br>Redirecting now...</div>
            <button class="btn-success-ok" id="successOkBtn">OK</button>
        </div>
    </div>

    <!-- 3. Error Modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-box">
            <div class="error-icon">&#10007;</div>
            <div class="error-text">Incorrect Authorize code</div>
            <div class="error-subtext">The code you entered is invalid.<br>Please try again.</div>
            <button class="btn-error-ok" id="errorOkBtn">Try Again</button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.getElementById('loginBtn');
            const authCodeInput = document.getElementById('authCodeInput');
            const loaderModal = document.getElementById('loaderModal');
            const successModal = document.getElementById('successModal');
            const errorModal = document.getElementById('errorModal');
            const successOkBtn = document.getElementById('successOkBtn');
            const errorOkBtn = document.getElementById('errorOkBtn');

            const CORRECT_CODE = '258000';
            // Change this link to whatever URL you want to open upon success
            const REDIRECT_LINK = 'https://www.google.com'; 

            /* LOGIN BUTTON CLICK LOGIC */
            loginBtn.addEventListener('click', function() {
                const enteredCode = authCodeInput.value.trim();

                if (!enteredCode) {
                    alert("Please enter an Authorization code.");
                    return;
                }

                // Show the loader
                loaderModal.style.display = 'flex';

                // Simulate a 1.5 second network delay
                setTimeout(function() {
                    // Hide the loader
                    loaderModal.style.display = 'none';

                    if (enteredCode === CORRECT_CODE) {
                        // Show success modal
                        successModal.style.display = 'flex';
                    } else {
                        // Show error modal
                        errorModal.style.display = 'flex';
                    }
                }, 1500); // 1500 milliseconds = 1.5 seconds
            });

            /* SUCCESS OK BUTTON - Close modal and OPEN LINK */
            successOkBtn.addEventListener('click', function() {
                successModal.style.display = 'none';
                // Open the link in a new tab
                window.open(REDIRECT_LINK, '_blank');
            });

            /* ERROR OK BUTTON - Close modal and clear input */
            errorOkBtn.addEventListener('click', function() {
                errorModal.style.display = 'none';
                authCodeInput.value = ''; // Clear the field for a retry
                authCodeInput.focus();
            });
        });
    </script>

</body>
</html>
