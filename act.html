<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcaret100 - Enter Activation Code</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        .header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .back-arrow {
            font-size: 22px;
            cursor: pointer;
            margin-right: 18px;
            text-decoration: none;
            color: #ffffff;
        }

        .header .title {
            font-size: 18px;
            font-weight: 400;
        }

        .content {
            padding: 20px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lock-image {
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
        }

        .lock-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .page-title {
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 42px;
            font-weight: bold;
            color: #000000;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .form-group {
            width: 100%;
            max-width: 380px;
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: none;
            outline: none;
            background-color: #6b8a96;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .form-group input::placeholder {
            color: #ffffff;
        }

        .form-group input:focus {
            background-color: #5a7a86;
        }

        .remember-me {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #4a90d9;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 16px;
            font-style: italic;
            color: #000000;
            cursor: pointer;
        }

        .activate-btn {
            padding: 14px 40px;
            background-color: #1a4d8c;
            color: #ffffff;
            border: none;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            margin-bottom: 30px;
            transition: background-color 0.3s;
        }

        .activate-btn:hover {
            background-color: #143d70;
        }

        .activate-btn:active {
            background-color: #0f2d55;
        }

        .get-one-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .get-one-section .dont-have {
            font-size: 18px;
            color: #000000;
        }

        .get-one-btn {
            padding: 12px 24px;
            background-color: #4CAF50;
            color: #000000;
            border: none;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .get-one-btn:hover {
            background-color: #43a047;
        }

        .get-one-btn:active {
            background-color: #388e3c;
        }

        /* Error Message Styles */
        .error-message {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 380px;
            padding: 15px;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .error-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .error-text {
            color: #d32f2f;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
        }

        .error-text span {
            display: block;
            font-size: 14px;
            font-weight: normal;
            margin-top: 5px;
            color: #b71c1c;
        }

        /* Loading Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            padding: 40px 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(26, 77, 140, 0.2);
            border-left-color: #1a4d8c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-description {
            font-size: 16px;
            color: #666;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }

            .page-title {
                font-size: 34px;
            }

            .form-group input {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="back-arrow" onclick="window.history.back(); return false;">&#8592;</a>
            <span class="title">Xcaret100</span>
        </div>

        <div class="content">
            <div class="lock-image">
                <img src="https://iili.io/CeK5yc7.jpg" alt="Security Lock">
            </div>

            <h1 class="page-title">Enter Activation Code</h1>

            <div class="form-group">
                <input type="text" placeholder="Username" id="username" autocomplete="off">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Password" id="password" autocomplete="off">
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>

            <button class="activate-btn" onclick="activate()">ACTIVATE</button>

            <!-- Error Message Block -->
            <div class="error-message" id="errorMessage">
                <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="#d32f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div class="error-text">
                    Incorrect details.
                    <span>Please get Activation details to proceed.</span>
                </div>
            </div>

            <div class="get-one-section">
                <span class="dont-have">Don't Have?</span>
                <button class="get-one-btn" onclick="getOne()">GET ONE!</button>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal-overlay" id="loadingModal">
        <div class="modal-content">
            <div class="spinner"></div>
            <h3 class="modal-title">Processing</h3>
            <p class="modal-description">Please wait while we verify your details...</p>
        </div>
    </div>

    <script>
        // Correct credentials
        const CORRECT_USERNAME = "xcaret100anonymous";
        const CORRECT_PASSWORD = "55210099779000";

        const errorMessage = document.getElementById('errorMessage');
        const loadingModal = document.getElementById('loadingModal');

        // Activate button handler
        function activate() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Hide error message initially
            errorMessage.classList.remove('show');

            if (!username || !password) {
                showError();
                return;
            }

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                // Show processing modal
                loadingModal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Prevent background scrolling

                // Redirect to success.html after 3 seconds
                setTimeout(function() {
                    window.location.href = 'success.html';
                }, 3000);
            } else {
                // Show error message
                showError();
            }
        }

        // Function to show error
        function showError() {
            errorMessage.classList.add('show');
            
            // Clear password field for security
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }

        // Get One button handler
        function getOne() {
            window.location.href = 'buyact.html';
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                activate();
            }
        });
    </script>
</body>
</html>
