<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcaret100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .back-arrow {
            font-size: 22px;
            cursor: pointer;
            margin-right: 18px;
            text-decoration: none;
            color: #ffffff;
        }

        .header .title {
            font-size: 18px;
            font-weight: 400;
        }

        .content {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .activate-image {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .activate-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .info-box {
            background-color: #1e5143;
            color: #ffffff;
            padding: 18px 16px;
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            width: 100%;
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .btn-buy {
            background-color: #5a9fd4;
            color: #ffffff;
        }

        .btn-buy:hover {
            background-color: #4a8fc4;
        }

        .btn-renew {
            background-color: #9b4d9e;
            color: #ffffff;
        }

        .btn-renew:hover {
            background-color: #8b3d8e;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }

            .buttons-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="back-arrow" onclick="window.history.back(); return false;">&#8592;</a>
            <span class="title">Xcaret100</span>
        </div>

        <div class="content">
            <div class="activate-image">
                <img src="https://iili.io/CeKslrG.jpg" alt="Activate Key">
            </div>

            <div class="info-box">
                You Can Get Activation Code Only From Vendor Below Using (BUY NEW/RENEW CODE) Also Note that Without Your Personal Activation Code No Transaction Carried On Xcaret100 will be Processed Successfully..
            </div>

            <div class="buttons-container">
                <button class="btn btn-buy" onclick="buyNew()">BUY NEW</button>
                <button class="btn btn-renew" onclick="renewCode()">RENEW CODE</button>
            </div>
        </div>
    </div>

    <script>
        function buyNew() {
            const phoneNumber = '2349112092317';
            const message = encodeURIComponent('Hello, I want to buy a new activation code for Xcaret100');
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        function renewCode() {
            const phoneNumber = '2349112092317';
            const message = encodeURIComponent('Hello, I want to renew my activation code for Xcaret100');
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
